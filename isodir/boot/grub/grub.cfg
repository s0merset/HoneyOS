# ============================================================
# grub.cfg — GRUB Bootloader Configuration for HoneyOS
# CMSC 125 — Operating Systems, UP Cebu
#
# Placed at /boot/grub/grub.cfg inside the ISO image.
# GRUB reads this file after the ISO boots, then loads the kernel.
#
# HoneyOS uses the Multiboot protocol: GRUB finds the magic header
# (0x1BADB002) in honeyos.bin and loads it into memory at 0x100000.
# ============================================================

# Boot the first (and only) menu entry automatically with no delay
set timeout=0
set default=0

# ── Boot Menu Entry ──
menuentry "HoneyOS" {
    # Load the HoneyOS kernel binary using the Multiboot protocol
    multiboot /boot/honeyos.bin

    # Hand control to the kernel — GRUB is done after this
    boot
}
